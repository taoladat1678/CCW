spring.application.name=ShopGiayTheThao


# Server port
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/shopgiaythethao?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
# 'update' automatically alters/creates tables to match entity changes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Cache (disable for instant UI reload in dev)
spring.thymeleaf.cache=false
