<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Giày</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #04AA6D;
            color: white;
        }
        tr:nth-child(even){background-color: #f2f2f2;}
        tr:hover {background-color: #ddd;}
    </style>
</head>
<body>
    <h1>Danh sách sản phẩm Giày</h1>
    
    <table>
        <thead>
            <tr>
                <th>Mã SP</th>
                <th>Tên sản phẩm</th>
                <th>Thương hiệu</th>
                <th>Màu sắc</th>
                <th>Giá</th>
                <th>Kho</th>
            </tr>
        </thead>
        <tbody>
            <!-- Chỉ sử dụng th:each của Thymeleaf để lặp qua danh sách giày -->
            <tr th:each="giay : ${danhSachGiay}">
                <td th:text="${giay.productId}"></td>
                <td th:text="${giay.productName}"></td>
                <td th:text="${giay.productBrand}"></td>
                <td th:text="${giay.productColor}"></td>
                <td th:text="${#numbers.formatDecimal(giay.productPrice, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
                <td th:text="${giay.productStock}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
